[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-automation-project"
version = "0.1.0"
description = "Story research, video production, review, and approved publishing workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0,<2.0",
  "streamlit>=1.40,<2.0",
  "pillow>=10,<13",
  "pyttsx3>=2.90,<3.0",
]

[project.optional-dependencies]
youtube = [
  "google-api-python-client>=2.150,<3.0",
  "google-auth-oauthlib>=1.2,<2.0",
  "google-auth-httplib2>=0.2,<1.0",
]
gemini = ["google-genai>=1.0,<2.0"]
speech = ["azure-cognitiveservices-speech>=1.40,<2.0"]
telegram = ["python-telegram-bot>=21.0,<23.0"]
all = [
  "google-api-python-client>=2.150,<3.0",
  "google-auth-oauthlib>=1.2,<2.0",
  "google-auth-httplib2>=0.2,<1.0",
  "google-genai>=1.0,<2.0",
  "azure-cognitiveservices-speech>=1.40,<2.0",
  "python-telegram-bot>=21.0,<23.0",
]

[project.scripts]
story-video = "story_video_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
